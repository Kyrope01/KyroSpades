  build-android:
    name: Build for Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            artifact_name: KyroSpades Android arm64-v8a.apk
          - abi: armeabi-v7a
            artifact_name: KyroSpades Android 32-bit (armeabi-v7a, older phones).apk
    steps:
      # NUCLEAR OPTION: Delete the poisoned caches before we even checkout the code.
      # This uses the pre-installed GitHub CLI to wipe the exact keys that are stuck.
      - name: Purge poisoned Android caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Purging potentially poisoned caches..."
          gh cache delete "android-${{ matrix.abi }}-api21-enet1.3.18-libdeflate1.20-openal1.23.1" --repo ${{ github.repository }} || true
          gh cache delete "android-v4-${{ matrix.abi }}-api21-enet1.3.18-libdeflate1.20-openal1.23.1" --repo ${{ github.repository }} || true
          gh cache delete "android-v5-${{ matrix.abi }}-api21-enet1.3.18-libdeflate1.20-openal1.23.1" --repo ${{ github.repository }} || true
          gh cache delete "android-v6-${{ matrix.abi }}-api21-enet1.3.18-libdeflate1.20-openal1.23.1" --repo ${{ github.repository }} || true
          echo "Purge complete."

      - name: Checkout your fork
        uses: actions/checkout@v4
        
      - name: Sync upstream KyroSpades
        run: |
          cp -r src /tmp/ks-backup-src
          cp -r cmake /tmp/ks-backup-cmake
          cp -r .github /tmp/ks-backup-github
          cp -r deps /tmp/ks-backup-deps
          cp CMakeLists.txt /tmp/ks-backup-cmakelists 2>/dev/null || true
          cp README.md /tmp/ks-backup-readme 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Kyrope01/KyroSpades.git || true
          git fetch upstream
          if ! git merge upstream/main --no-edit; then
            echo "::warning::Upstream merge failed (diverged history / conflicts) — building WITHOUT latest upstream changes."
            git merge --abort || true
          fi
          rm -rf src && mv /tmp/ks-backup-src src
          rm -rf cmake && mv /tmp/ks-backup-cmake cmake
          rm -rf .github && mv /tmp/ks-backup-github .github
          rm -rf deps && mv /tmp/ks-backup-deps deps
          mv /tmp/ks-backup-cmakelists CMakeLists.txt 2>/dev/null || true
          mv /tmp/ks-backup-readme README.md 2>/dev/null || true
        shell: bash

      - name: Ensure Android asset script exists
        run: |
          if [[ ! -f package_android_assets.sh ]]; then
            echo "package_android_assets.sh missing after upstream merge — creating inline"
            cat > package_android_assets.sh << 'ASSETS_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          KS_DIR="${1:-$SCRIPT_DIR}"
          ASSETS="$KS_DIR/android/app/src/main/assets"
          [[ -d "$KS_DIR/resources" ]] || { echo "::error::resources/ directory not found"; exit 1; }
          if [[ ! -f "$KS_DIR/bsresources.zip" ]]; then
            echo "bsresources.zip not found — downloading ..."
            curl -L --fail -o "$KS_DIR/bsresources.zip" http://aos.party/bsresources.zip
          fi
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          echo "[1/3] Copying resources/ ..."
          cp -R "$KS_DIR/resources/." "$ASSETS/"
          rm -f "$ASSETS/icon.rc"
          echo "[2/3] Extracting bsresources.zip ..."
          unzip -o -q "$KS_DIR/bsresources.zip" -d "$ASSETS"
          find "$ASSETS" -name '.gitignore' -delete
          if [[ -d "$KS_DIR/resources.override" ]]; then
            echo "[3/3] Applying resources.override/ ..."
            cp -R "$KS_DIR/resources.override/." "$ASSETS/"
          else
            echo "[3/3] No resources.override/ — skipping"
          fi
          echo "Done. config.ini: $( [[ -f "$ASSETS/config.ini" ]] && echo present || echo MISSING )"
          ASSETS_EOF
            chmod +x package_android_assets.sh
          fi
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK + CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1"

      # Split into restore and save to prevent saving partial/broken caches
      - name: Restore Android native deps cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: build-android/deps-install
          # Bumped to v6, and explicitly NO restore-keys to prevent fallback poisoning
          key: android-v6-${{ matrix.abi }}-api21-enet1.3.18-libdeflate1.20-openal1.23.1

      - name: Validate cached architectures (Post-Restore Guard)
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then EXPECT="AArch64"; else EXPECT="ARM"; fi
          
          POISONED=0
          for lib in libenet.a libdeflate.a libopenal.a; do
            FILE="build-android/deps-install/lib/$lib"
            if [ -f "$FILE" ]; then
              MACHINE=$("$READELF" -h "$FILE" 2>/dev/null | grep "Machine:" | awk '{print $NF}' | head -1)
              echo "$lib machine: $MACHINE (Expected: $EXPECT)"
              if [[ "$MACHINE" != *"$EXPECT"* ]]; then
                echo "::warning::CACHE POISONED! $lib is $MACHINE, expected $EXPECT."
                POISONED=1
              fi
            fi
          done
          
          if [ "$POISONED" -eq 1 ]; then
            echo "Deleting poisoned cache directory so the build step is forced to rebuild..."
            rm -rf build-android/deps-install
          fi

      - name: Build native deps (enet + libdeflate + openal)
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          DEPS="$GITHUB_WORKSPACE/build-android/deps-install"
          mkdir -p "$DEPS/lib" "$DEPS/include"
          COMMON="-DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
                  -DANDROID_ABI=${{ matrix.abi }} \
                  -DANDROID_PLATFORM=android-21 \
                  -DANDROID_STL=c++_static \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_INSTALL_PREFIX=$DEPS \
                  -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          if [ ! -f "$DEPS/lib/libenet.a" ]; then
            curl -L -o enet.tar.gz https://github.com/lsalzman/enet/archive/refs/tags/v1.3.18.tar.gz
            tar xzf enet.tar.gz
            cmake -S enet-1.3.18 -B enet-build $COMMON
            cmake --build enet-build --parallel
            find enet-build -name 'libenet.a' -exec cp {} "$DEPS/lib/" \;
            cp -r enet-1.3.18/include/enet "$DEPS/include/"
          fi
          if [ ! -f "$DEPS/lib/libdeflate.a" ]; then
            curl -L -o libdeflate.tar.gz https://github.com/ebiggers/libdeflate/archive/refs/tags/v1.20.tar.gz
            tar xzf libdeflate.tar.gz
            cmake -S libdeflate-1.20 -B libdeflate-build $COMMON \
                  -DLIBDEFLATE_BUILD_SHARED_LIB=OFF \
                  -DLIBDEFLATE_BUILD_STATIC_LIB=ON \
                  -DLIBDEFLATE_BUILD_GZIP=OFF \
                  -DLIBDEFLATE_BUILD_TESTS=OFF
            cmake --build libdeflate-build --parallel
            cmake --install libdeflate-build
          fi
          if [ ! -f "$DEPS/lib/libopenal.a" ]; then
            curl -L -o openal.tar.gz https://github.com/kcat/openal-soft/archive/refs/tags/1.23.1.tar.gz
            tar xzf openal.tar.gz
            cmake -S openal-soft-1.23.1 -B openal-build $COMMON \
                  -DLIBTYPE=STATIC \
                  -DALSOFT_EXAMPLES=OFF \
                  -DALSOFT_TESTS=OFF \
                  -DALSOFT_UTILS=OFF \
                  -DALSOFT_BACKEND_OPENSL=ON \
                  -DALSOFT_BACKEND_OBOE=OFF
            cmake --build openal-build --parallel
            cmake --install openal-build
          fi

      # Save the cache only if we actually built something new
      - name: Save Android native deps cache
        if: steps.cache-restore.outputs.cache-hit != 'true' || !hashFiles('build-android/deps-install/lib/libopenal.a')
        uses: actions/cache/save@v4
        with:
          path: build-android/deps-install
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Package game assets into the APK project
        run: |
          chmod +x package_android_assets.sh
          ./package_android_assets.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Restore release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KS_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore restored from secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set."
            echo "The release APK will be signed with the debug key (still installable on phones)."
          fi

      - name: Build APK (assembleRelease)
        env:
          KS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PksAbiFilters=${{ matrix.abi }} --no-daemon

      - name: Collect APK
        run: |
          mkdir -p build
          cp android/app/build/outputs/apk/release/*.apk "build/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}-build
          path: build/*.apk
