# .github/workflows/deep-audit.yml
# KyroSpades deep audit. Manual trigger only. Every tool is free and installed
# by this workflow at run time (apt / pip / public GitHub release downloads).
# No secrets, no API keys, no licenses, no external services.
#
# Optional repo hooks, all free, all best-effort. The report states loudly
# which tools were skipped and exactly which file would enable them:
#   audit/build.sh          your build command, if autodetection gets it wrong
#   audit/run-headless.sh   any smoke run (demo scene, config load, packet parse);
#                           sanitizers, Valgrind and Heaptrack feed on this
#   audit/fuzz-targets.txt  one libFuzzer source per line (else we glob *fuzz*.c)
#   audit/eva-targets.txt   one C file per line for Frama-C EVA (else skipped)
#   audit/esbmc/*.c         assertion harnesses for ESBMC (else skipped)
#   audit/cbmc/*.c          assertion harnesses for CBMC (falls back to audit/esbmc/)
#   audit/cocci/*.cocci     semantic patterns for Coccinelle (else a built-in
#                           NaN-source rule for sqrt/asin/acos/log runs)
#   .semgrep/custom.yml     your community-bug tripwire rules

name: deep-audit

on:
  workflow_dispatch:
    inputs:
      fuzz_budget_seconds:
        description: Total libFuzzer seconds spread across all targets
        default: "1800"
      run_heavy:
        description: Also run fuzzing, Valgrind, Infer and Heaptrack (slow)
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

concurrency:
  group: deep-audit
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ------------------------------------------------------------- build gate
  build-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Toolchain and project dependencies (best effort)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config bear python3-pip \
            hardening-includes checksec \
            libsdl2-dev libglfw3-dev libglew-dev libgl1-mesa-dev \
            libenet-dev libdeflate-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            libpulse-dev libopenal-dev || true
          pip3 install --quiet lizard || true
      - name: Build and capture compilation database
        run: |
          mkdir -p out
          set +e
          if [ -x audit/build.sh ]; then
            bear -- ./audit/build.sh > out/build.log 2>&1
          elif [ -f CMakeLists.txt ]; then
            cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON >> out/build.log 2>&1
            bear -- cmake --build build -j"$(nproc)" >> out/build.log 2>&1
          elif [ -f Makefile ]; then
            bear -- make -j"$(nproc)" -k >> out/build.log 2>&1
          else
            echo "no known build system found" | tee out/build.log
          fi
          rc=$?
          [ -f build/compile_commands.json ] && cp build/compile_commands.json out/
          [ -f compile_commands.json ] && [ ! -f out/compile_commands.json ] && cp compile_commands.json out/
          if [ -f out/compile_commands.json ]; then echo ok > out/status.txt; else echo failed > out/status.txt; fi
          echo "$rc" >> out/status.txt
          echo "compilation database: $(test -f out/compile_commands.json && echo captured || echo MISSING)"
      - name: Warning and -fanalyzer pass over every translation unit
        run: |
          set +e
          python3 - <<'PY' > out/warnings.log 2>&1 || true
          import json, subprocess, os, sys
          db = 'out/compile_commands.json'
          if not os.path.exists(db):
              print('SKIPPED: no compile_commands.json, warning pass needs a successful build')
              sys.exit(0)
          extra = ['-fsyntax-only','-Wall','-Wextra','-Wconversion','-Wsign-conversion',
                   '-Wfloat-equal','-Wdouble-promotion','-fanalyzer']
          for e in json.load(open(db)):
              cmd = e['command'].split() if 'command' in e else ['gcc'] + e.get('arguments',[])
              src = e['file']
              rest = [c for c in cmd[1:] if c != src and not c.startswith('-o') and not c.startswith('-M')]
              r = subprocess.run(['gcc', src] + rest + extra,
                                 capture_output=True, text=True, cwd=e.get('directory','.'))
              if r.stderr.strip():
                  print(f"=== {src}\n{r.stderr}")
          PY
          echo "warning pass finished"
      - name: Binary hardening check (best effort)
        run: |
          set +e
          : > out/hardening.log
          for b in $(find . -maxdepth 3 -type f -perm -u+x ! -name '*.sh' ! -name '*.py' 2>/dev/null | head -5); do
            echo "== $b" >> out/hardening.log
            checksec --file="$b" >> out/hardening.log 2>&1 || hardening-check "$b" >> out/hardening.log 2>&1 || true
          done
          echo ok > /dev/null
      - uses: actions/upload-artifact@v4
        with: { name: out-build, path: out/ }

  # ------------------------------------------- workflow configuration self-audit
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: actionlint and zizmor over .github/workflows
        run: |
          mkdir -p out
          set +e
          AL=$(curl -s https://api.github.com/repos/rhysd/actionlint/releases/latest \
               | grep -o 'https://[^"]*actionlint_[0-9.]*_linux_amd64\.tar\.gz' | head -1)
          if [ -n "$AL" ]; then
            curl -sL "$AL" | tar xz actionlint
            ./actionlint -color never .github/workflows/*.yml > out/actionlint.log 2>&1
          else
            echo "SKIPPED: could not resolve an actionlint release asset" > out/actionlint.log
          fi
          pip3 install --quiet zizmor || true
          if command -v zizmor >/dev/null 2>&1; then
            zizmor --format sarif . > out/zizmor.sarif 2> out/zizmor.log
            zrc=$?
          else
            echo "SKIPPED: zizmor install failed" > out/zizmor.log
            zrc=0
          fi
          if [ $zrc -le 1 ]; then echo ok > out/status.txt; else echo failed > out/status.txt; fi
          echo $zrc >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-workflow-lint, path: out/ }

  # ----------------------------------------------------------------- CodeQL
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: none   # build-free C/C++ scanning: works even when the build is broken
      - uses: github/codeql-action/analyze@v3
        with:
          output: codeql-sarif
          category: deep-audit
      - name: Collect
        run: |
          mkdir -p out
          cp codeql-sarif/*.sarif out/codeql.sarif 2>/dev/null || true
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-codeql, path: out/ }

  # --------------------------------------------------------------- cppcheck
  cppcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: out-build, path: build-db }
        continue-on-error: true
      - name: Run cppcheck plus threadsafety and y2038 addons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
          mkdir -p out
          set +e
          PROJ=""
          [ -f build-db/compile_commands.json ] && PROJ="--project=build-db/compile_commands.json"
          cppcheck $PROJ --enable=warning,performance,portability --inline-suppr \
            --template=gcc src/ > out/cppcheck.log 2>&1
          rc=$?
          for a in threadsafety y2038; do
            echo "===== addon $a" >> out/cppcheck.log
            cppcheck $PROJ --addon=$a src/ >> out/cppcheck.log 2>&1 || true
          done
          if [ $rc -eq 0 ]; then echo ok > out/status.txt; else echo failed > out/status.txt; fi
          echo $rc >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-cppcheck, path: out/ }

  # ------------------------------------------------------------- clang-tidy
  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: out-build, path: build-db }
        continue-on-error: true
      - name: Run clang-tidy over the compilation database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-tidy
          mkdir -p out
          set +e
          if [ ! -f build-db/compile_commands.json ]; then
            echo "SKIPPED: no compile_commands.json" > out/clang-tidy.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          cp build-db/compile_commands.json .
          find src -name '*.c' -o -name '*.cpp' | xargs -P"$(nproc)" -n1 -I{} \
            clang-tidy -p . --checks='-*,bugprone-*,cert-*,misc-*,performance-*,clang-analyzer-*' {} \
            >> out/clang-tidy.log 2>&1
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-clang-tidy, path: out/ }

  # ---------------------------------------------------- clang static analyser
  scan-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Run scan-build over a fresh build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-tools build-essential cmake \
            libsdl2-dev libglfw3-dev libglew-dev libgl1-mesa-dev \
            libenet-dev libdeflate-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev \
            libpulse-dev libopenal-dev || true
          mkdir -p out
          set +e
          if [ -x audit/build.sh ]; then
            scan-build -o out/sb-report ./audit/build.sh > out/scan-build.log 2>&1
          elif [ -f CMakeLists.txt ]; then
            scan-build -o out/sb-report cmake -B build-sb > /dev/null 2>&1
            scan-build -o out/sb-report cmake --build build-sb -j"$(nproc)" >> out/scan-build.log 2>&1
          elif [ -f Makefile ]; then
            scan-build -o out/sb-report make -j"$(nproc)" -k >> out/scan-build.log 2>&1
          else
            echo "SKIPPED: no build system" > out/scan-build.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-scan-build, path: out/ }

  # ------------------------------------------------------------------- Infer
  infer:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    if: ${{ inputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and run Infer from its public release
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq default-jre-headless build-essential cmake \
            libsdl2-dev libglfw3-dev libglew-dev libgl1-mesa-dev \
            libenet-dev libdeflate-dev libopenal-dev || true
          mkdir -p out
          set +e
          URL=$(curl -s https://api.github.com/repos/facebook/infer/releases/latest \
                | grep browser_download_url | grep -o 'https://[^"]*linux64[^"]*' | head -1)
          if [ -z "$URL" ]; then
            echo "SKIPPED: could not resolve an Infer release asset" > out/infer.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          curl -sL "$URL" -o infer.tar.xz && tar xf infer.tar.xz
          export PATH="$PWD/$(tar tf infer.tar.xz | head -1 | cut -d/ -f1)/bin:$PATH"
          if [ -x audit/build.sh ]; then
            infer run -- ./audit/build.sh > out/infer.log 2>&1
          elif [ -f CMakeLists.txt ]; then
            infer run -- cmake -B build-infer > /dev/null 2>&1
            infer run -- cmake --build build-infer -j"$(nproc)" >> out/infer.log 2>&1
          elif [ -f Makefile ]; then
            infer run -- make -j"$(nproc)" -k >> out/infer.log 2>&1
          fi
          cp -r infer-out out/infer-out 2>/dev/null || true
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-infer, path: out/ }

  # ----------------------------------------------------------------- semgrep
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run semgrep with public registry rules plus your custom tripwires
        run: |
          pip3 install --quiet semgrep
          mkdir -p out
          set +e
          CONFIGS="--config p/c --config p/security-audit"
          [ -f .semgrep/custom.yml ] && CONFIGS="$CONFIGS --config .semgrep/custom.yml"
          semgrep scan $CONFIGS --sarif -o out/semgrep.sarif --metrics=off src/ > out/semgrep.log 2>&1
          rc=$?
          if [ $rc -le 1 ]; then echo ok > out/status.txt; else echo failed > out/status.txt; fi
          echo $rc >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-semgrep, path: out/ }

  # --------------------------------------------------------------- flawfinder
  flawfinder:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dangerous-function scan
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flawfinder
          mkdir -p out
          set +e
          if [ ! -d src ]; then
            echo "SKIPPED: no src/ directory" > out/flawfinder.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          flawfinder --sarif --minlevel=2 --columns src/ > out/flawfinder.sarif 2> out/flawfinder.log
          rc=$?
          if [ $rc -le 1 ]; then echo ok > out/status.txt; else echo failed > out/status.txt; fi
          echo $rc >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-flawfinder, path: out/ }

  # ------------------------------------------------------------------ smatch
  smatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build and run smatch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev libxml2-dev libgtk-3-dev pkg-config
          mkdir -p out
          set +e
          if [ ! -d src ]; then
            echo "SKIPPED: no src/ directory" > out/smatch.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          git clone --depth 1 https://github.com/error27/smatch.git /tmp/smatch > out/smatch.log 2>&1
          make -C /tmp/smatch -j"$(nproc)" smatch >> out/smatch.log 2>&1
          if [ ! -x /tmp/smatch/smatch ]; then
            echo "SKIPPED: smatch source build failed" >> out/smatch.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          find src -name '*.c' | xargs -P"$(nproc)" -n1 -I{} \
            /tmp/smatch/smatch -I src -I . {} >> out/smatch.log 2>&1
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-smatch, path: out/ }

  # --------------------------------------------------------------- coccinelle
  coccinelle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Semantic patterns for NaN-producing math
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq coccinelle
          mkdir -p out
          set +e
          if [ ! -d src ]; then
            echo "SKIPPED: no src/ directory" > out/coccinelle.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          if [ -d audit/cocci ] && [ -n "$(ls -A audit/cocci/*.cocci 2>/dev/null)" ]; then
            RULES="audit/cocci"
          else
            {
              echo '@nan_source@'
              echo 'expression E;'
              echo 'position p;'
              echo '@@'
              echo '('
              echo '  sqrt(E)@p'
              echo '|'
              echo '  sqrtf(E)@p'
              echo '|'
              echo '  asin(E)@p'
              echo '|'
              echo '  asinf(E)@p'
              echo '|'
              echo '  acos(E)@p'
              echo '|'
              echo '  acosf(E)@p'
              echo '|'
              echo '  log(E)@p'
              echo '|'
              echo '  logf(E)@p'
              echo '|'
              echo '  log10f(E)@p'
              echo ')'
            } > out/default.cocci
            RULES="out/default.cocci"
          fi
          spatch --sp-file $RULES --dir src -I src --very-quiet > out/coccinelle.log 2>&1
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-coccinelle, path: out/ }

  # -------------------------------------------------------------- Frama-C EVA
  frama-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Run EVA float alarms on the listed math and audio targets
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq frama-c || true
          mkdir -p out
          set +e
          if [ ! -f audit/eva-targets.txt ]; then
            echo "SKIPPED: list files in audit/eva-targets.txt (e.g. src/sound.c) to enable NaN and infinity alarms" > out/frama-c.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          : > out/frama-c.log
          while read -r f; do
            [ -f "$f" ] || continue
            echo "===== EVA $f" >> out/frama-c.log
            frama-c -eva "$f" -I src -I . >> out/frama-c.log 2>&1 | true
          done < audit/eva-targets.txt
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-frama-c, path: out/ }

  # ------------------------------------------------------------------- ESBMC
  esbmc:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Model-check the assertion harnesses from its public release
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang unzip || true
          mkdir -p out
          set +e
          URL=$(curl -s https://api.github.com/repos/esbmc/esbmc/releases/latest \
                | grep browser_download_url | grep -io 'https://[^"]*ubuntu[^"]*\.zip' | head -1)
          if [ -z "$URL" ]; then
            echo "SKIPPED: could not resolve an ESBMC release asset" > out/esbmc.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          curl -sL "$URL" -o esbmc.zip && unzip -q esbmc.zip
          ESBMC=$(find . -maxdepth 3 -name esbmc -type f | head -1)
          if [ ! -d audit/esbmc ] || [ -z "$(ls -A audit/esbmc 2>/dev/null)" ]; then
            echo "SKIPPED: add harnesses to audit/esbmc/, e.g. assert(isfinite(attenuation)) around your math" > out/esbmc.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          : > out/esbmc.log
          for h in audit/esbmc/*.c; do
            echo "===== ESBMC $h" >> out/esbmc.log
            "$ESBMC" "$h" -I src -I . --floatbv --no-pointer-check >> out/esbmc.log 2>&1 | true
          done
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-esbmc, path: out/ }

  # -------------------------------------------------------------------- CBMC
  cbmc:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Bounded model checking of assertion harnesses
        run: |
          mkdir -p out
          set +e
          URL=$(curl -s https://api.github.com/repos/diffblue/cbmc/releases/latest \
                | grep browser_download_url | grep -o 'https://[^"]*ubuntu[^"]*\.deb' | head -1)
          if [ -n "$URL" ]; then
            curl -sL "$URL" -o /tmp/cbmc.deb && sudo dpkg -i /tmp/cbmc.deb > out/cbmc.log 2>&1
            sudo apt-get install -y -f >> out/cbmc.log 2>&1
          fi
          if ! command -v cbmc >/dev/null 2>&1; then
            echo "SKIPPED: no cbmc binary in the latest release assets" > out/cbmc.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          H=""
          [ -d audit/cbmc ] && H=$(ls audit/cbmc/*.c 2>/dev/null)
          [ -z "$H" ] && [ -d audit/esbmc ] && H=$(ls audit/esbmc/*.c 2>/dev/null)
          if [ -z "$H" ]; then
            echo "SKIPPED: add harnesses to audit/cbmc/ (or audit/esbmc/)" >> out/cbmc.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          for h in $H; do
            echo "===== CBMC $h" >> out/cbmc.log
            cbmc "$h" -I src -I . --trace \
              --bounds-check --pointer-check --div-by-zero-check \
              --signed-overflow-check --float-overflow-check --nan-check >> out/cbmc.log 2>&1
          done
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-cbmc, path: out/ }

  # -------------------------------------------------------------- sanitizers
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan and UBSan and run the headless hook
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake clang \
            libsdl2-dev libglfw3-dev libglew-dev libgl1-mesa-dev \
            libenet-dev libdeflate-dev libopenal-dev || true
          mkdir -p out
          set +e
          if [ ! -x audit/run-headless.sh ]; then
            echo "SKIPPED: add audit/run-headless.sh (any smoke run) so the sanitizers have a code path to execute" > out/sanitizers.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          export CC=clang CXX=clang++
          export CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g -O1"
          export CXXFLAGS="$CFLAGS" LDFLAGS="$CFLAGS"
          ./audit/run-headless.sh > out/sanitizers.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then echo ok > out/status.txt; else echo failed > out/status.txt; fi
          echo $rc >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-sanitizers, path: out/ }

  # ---------------------------------------------------------------- valgrind
  valgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    if: ${{ inputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
      - name: Memcheck and Helgrind over the headless hook
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake valgrind \
            libsdl2-dev libglfw3-dev libglew-dev libgl1-mesa-dev \
            libenet-dev libdeflate-dev libopenal-dev || true
          mkdir -p out
          set +e
          if [ ! -x audit/run-headless.sh ]; then
            echo "SKIPPED: needs audit/run-headless.sh" > out/valgrind.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          [ -x audit/build.sh ] && ./audit/build.sh > /dev/null 2>&1
          valgrind --tool=memcheck --leak-check=full --track-origins=yes \
            ./audit/run-headless.sh > out/valgrind-memcheck.log 2>&1
          valgrind --tool=helgrind ./audit/run-headless.sh > out/valgrind-helgrind.log 2>&1
          cat out/valgrind-memcheck.log out/valgrind-helgrind.log > out/valgrind.log
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-valgrind, path: out/ }

  # --------------------------------------------------------------- heaptrack
  heaptrack:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: ${{ inputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
      - name: Allocation profile over the headless hook
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq heaptrack build-essential cmake \
            libsdl2-dev libglfw3-dev libglew-dev libgl1-mesa-dev \
            libenet-dev libdeflate-dev libopenal-dev || true
          mkdir -p out
          set +e
          if [ ! -x audit/run-headless.sh ]; then
            echo "SKIPPED: needs audit/run-headless.sh" > out/heaptrack.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          heaptrack -o out/heaptrack.data ./audit/run-headless.sh > out/heaptrack.log 2>&1
          heaptrack_print out/heaptrack.data* >> out/heaptrack.log 2>&1 || true
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-heaptrack, path: out/ }

  # ----------------------------------------------------------------- fuzzing
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    if: ${{ inputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
      - name: libFuzzer over every target, crash inputs preserved
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang \
            libsdl2-dev libglfw3-dev libenet-dev libdeflate-dev libopenal-dev || true
          mkdir -p out/crashes
          set +e
          if [ -f audit/fuzz-targets.txt ]; then TARGETS=$(cat audit/fuzz-targets.txt)
          else TARGETS=$(find src -name '*fuzz*.c' 2>/dev/null); fi
          if [ -z "$TARGETS" ]; then
            echo "SKIPPED: no fuzz targets; add libFuzzer harnesses (LLVMFuzzerTestOneInput) for packet parse, config parse, map load" > out/fuzz.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          : > out/fuzz.log
          BUDGET=${{ inputs.fuzz_budget_seconds }}
          N=$(echo "$TARGETS" | wc -w)
          PER=$(( BUDGET / (N > 0 ? N : 1) ))
          for t in $TARGETS; do
            echo "===== fuzz $t for ${PER}s" >> out/fuzz.log
            bin="out/$(basename "$t" .c)-fuzz"
            clang -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -g -O1 \
              -I src -I . "$t" -o "$bin" >> out/fuzz.log 2>&1 || { echo "build failed: $t" >> out/fuzz.log; continue; }
            "$bin" -max_total_time="$PER" -artifact_prefix=out/crashes/ >> out/fuzz.log 2>&1
          done
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-fuzz, path: out/ }

  # -------------------------------------------------------------------- AFL++
  afl:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    if: ${{ inputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
      - name: AFL++ over the same harnesses
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq afl++ clang \
            libsdl2-dev libglfw3-dev libenet-dev libdeflate-dev libopenal-dev || true
          mkdir -p out
          set +e
          DRIVER=$(find /usr -name 'libAFLDriver.a' 2>/dev/null | head -1)
          if [ -z "$DRIVER" ]; then
            echo "SKIPPED: libAFLDriver.a not shipped by this afl++ package" > out/afl.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          if [ -f audit/fuzz-targets.txt ]; then TARGETS=$(cat audit/fuzz-targets.txt)
          else TARGETS=$(find src -name '*fuzz*.c' 2>/dev/null); fi
          if [ -z "$TARGETS" ]; then
            echo "SKIPPED: no fuzz targets" > out/afl.log
            echo skipped > out/status.txt; echo 0 >> out/status.txt; exit 0
          fi
          : > out/afl.log
          BUDGET=${{ inputs.fuzz_budget_seconds }}
          N=$(echo "$TARGETS" | wc -w)
          PER=$(( BUDGET / (N > 0 ? N : 1) ))
          export AFL_SKIP_CPUFREQ=1 AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 AFL_NO_UI=1
          export AFL_USE_ASAN=1 AFL_USE_UBSAN=1
          for t in $TARGETS; do
            name=$(basename "$t" .c)
            bin="out/afl-$name"
            echo "===== afl $t for ${PER}s" >> out/afl.log
            afl-clang-fast -g -O1 -I src -I . "$t" "$DRIVER" -o "$bin" >> out/afl.log 2>&1 \
              || { echo "build failed: $t" >> out/afl.log; continue; }
            mkdir -p "out/in-$name" "out/findings-$name"
            echo "seed" > "out/in-$name/seed"
            timeout "${PER}s" afl-fuzz -i "out/in-$name" -o "out/findings-$name" -- "$bin" >> out/afl.log 2>&1
          done
          find out -path '*crashes*' -type f ! -name 'README.txt' 2>/dev/null | head -100 > out/afl-crashes.txt
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-afl, path: out/ }

  # -------------------------------------------------------- dependency CVEs
  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: osv-scanner over vendored C and C++
        run: |
          mkdir -p out
          set +e
          URL=$(curl -s https://api.github.com/repos/google/osv-scanner/releases/latest \
                | grep browser_download_url | grep -o 'https://[^"]*linux_amd64[^"]*' | head -1)
          curl -sL "$URL" -o osv-scanner && chmod +x osv-scanner
          ./osv-scanner scan --format sarif --output out/osv.sarif . > out/osv.log 2>&1
          rc=$?
          if [ $rc -le 1 ]; then echo ok > out/status.txt; else echo failed > out/status.txt; fi
          echo $rc >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-osv, path: out/ }

  # ---------------------------------------------------------------------- SBOM
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: CycloneDX SBOM plus Grype CVE scan
        run: |
          mkdir -p out
          set +e
          SY=$(curl -s https://api.github.com/repos/anchore/syft/releases/latest \
               | grep browser_download_url | grep -o 'https://[^"]*linux_amd64\.tar\.gz' | head -1)
          GR=$(curl -s https://api.github.com/repos/anchore/grype/releases/latest \
               | grep browser_download_url | grep -o 'https://[^"]*linux_amd64\.tar\.gz' | head -1)
          if [ -n "$SY" ]; then
            curl -sL "$SY" | tar xz -C /tmp syft && sudo install /tmp/syft /usr/local/bin/
            syft . -o cyclonedx-json=out/sbom.cdx.json -q > out/sbom.log 2>&1
          else
            echo "SKIPPED: could not resolve a syft release asset" > out/sbom.log
          fi
          if [ -n "$GR" ] && [ -f out/sbom.cdx.json ]; then
            curl -sL "$GR" | tar xz -C /tmp grype && sudo install /tmp/grype /usr/local/bin/
            grype sbom:out/sbom.cdx.json -o sarif > out/grype.sarif 2> out/grype.log
            rc=$?
          else
            echo "SKIPPED: grype unavailable or no SBOM to scan" > out/grype.log
            rc=0
          fi
          if [ $rc -le 1 ]; then echo ok > out/status.txt; else echo failed > out/status.txt; fi
          echo $rc >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-sbom, path: out/ }

  # ----------------------------------------------------------------- secrets
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks over full history
        run: |
          mkdir -p out
          set +e
          URL=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                | grep browser_download_url | grep -o 'https://[^"]*linux_x64[^"]*tar\.gz' | head -1)
          curl -sL "$URL" | tar xz gitleaks
          ./gitleaks detect --source . --report-format sarif --report-path out/gitleaks.sarif \
            > out/gitleaks.log 2>&1
          rc=$?
          if [ $rc -le 1 ]; then echo ok > out/status.txt; else echo failed > out/status.txt; fi
          echo $rc >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-gitleaks, path: out/ }

  # ----------------------------------------------------------- secrets, part 2
  secrets-extra:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verified secrets (trufflehog) and entropy scan (detect-secrets)
        run: |
          mkdir -p out
          set +e
          pip3 install --quiet detect-secrets || true
          if command -v detect-secrets >/dev/null 2>&1; then
            detect-secrets scan --all-files --force-use-all-plugins \
              > out/detect-secrets.json 2> out/detect-secrets.log
          else
            echo "SKIPPED: detect-secrets install failed" > out/detect-secrets.log
          fi
          URL=$(curl -s https://api.github.com/repos/trufflesecurity/trufflehog/releases/latest \
                | grep browser_download_url | grep -o 'https://[^"]*linux_amd64\.tar\.gz' | head -1)
          if [ -n "$URL" ]; then
            curl -sL "$URL" | tar xz trufflehog
            ./trufflehog filesystem . --json --no-update --results=verified,unknown \
              > out/trufflehog.json 2> out/trufflehog.log
          else
            echo "SKIPPED: could not resolve a trufflehog release asset" > out/trufflehog.log
          fi
          echo ok > out/status.txt; echo 0 >> out/status.txt
      - uses: actions/upload-artifact@v4
        with: { name: out-secrets-extra, path: out/ }

  # ------------------------------------------------------------ the one file
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [build-gate, workflow-lint, codeql, cppcheck, clang-tidy, scan-build, infer,
            semgrep, flawfinder, smatch, coccinelle, frama-c, esbmc, cbmc,
            sanitizers, valgrind, heaptrack, fuzz, afl, osv, sbom, gitleaks, secrets-extra]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          path: raw
          pattern: out-*
          merge-multiple: false
      - name: Merge every tool into KyroSpades-Audit.md
        run: |
          pip3 install --quiet lizard || true
          python3 - <<'PY'
          import json, os, re, glob, subprocess, collections
          RAW, OUT = 'raw', 'KyroSpades-Audit.md'
          SEV = {'error':'high','warning':'medium','note':'low','none':'info'}
          ORD = {'high':0,'medium':1,'low':2,'info':3}
          WEIGHT = {'esbmc':0,'cbmc':0,'frama-c':0,'fuzz':0,'afl':0,'sanitizers':0,
                    'valgrind':1,'scan-build':1,'codeql':1,'infer':1,'gcc-warnings':1,
                    'heaptrack':1,'secrets-extra':1,
                    'cppcheck':2,'clang-tidy':2,'semgrep':2,'smatch':2,'coccinelle':2,
                    'workflow-lint':2,
                    'osv':3,'gitleaks':3,'flawfinder':3,'sbom':3}
          EXPECTED = ['build','workflow-lint','codeql','cppcheck','clang-tidy','scan-build','infer',
                      'semgrep','flawfinder','smatch','coccinelle','frama-c','esbmc','cbmc',
                      'sanitizers','valgrind','heaptrack','fuzz','afl','osv','sbom',
                      'gitleaks','secrets-extra']
          findings, sections, statuses = [], [], {}
          def add(tool, sev, rule, msg, file='', line=0):
              findings.append({'tool':tool,'severity':sev,'rule':rule,
                               'message':msg[:300],'file':file,'line':line})
          gccpat = re.compile(r'^(.+?\.[ch]):(\d+):(\d+): (warning|error|note): (.*)$')
          genpat = re.compile(r'^(.+?\.[A-Za-z]+):(\d+):(?:(\d+):)?\s*(?:warning|error|note)?:?\s*(.*)$')
          for d in sorted(glob.glob(RAW + '/out-*')):
              tool = os.path.basename(d)[4:]
              st, rc = 'unknown', ''
              p = os.path.join(d, 'status.txt')
              if os.path.exists(p):
                  L = open(p, errors='replace').read().splitlines()
                  st = L[0] if L else 'unknown'; rc = L[1] if len(L) > 1 else ''
              statuses[tool] = (st, rc)
              n0 = len(findings)
              for s in glob.glob(d + '/*.sarif'):
                  try: data = json.load(open(s, errors='replace'))
                  except Exception: continue
                  for run in data.get('runs', []):
                      for res in run.get('results', []):
                          pl = (res.get('locations') or [{}])[0].get('physicalLocation', {})
                          add(tool, SEV.get(res.get('level','warning'),'medium'),
                              res.get('ruleId','?'), res.get('message',{}).get('text',''),
                              pl.get('artifactLocation',{}).get('uri',''),
                              pl.get('region',{}).get('startLine',0))
              wl = os.path.join(d, 'warnings.log')
              if os.path.exists(wl):
                  for line in open(wl, errors='replace'):
                      m = gccpat.match(line.strip())
                      if m:
                          sev = {'warning':'medium','error':'high','note':'info'}[m.group(4)]
                          rule = 'gcc-fanalyzer' if '-Wanalyzer' in m.group(5) else 'gcc-' + m.group(4)
                          add('gcc-warnings', sev, rule, m.group(5), m.group(1), int(m.group(2)))
              for lg in ('sanitizers.log','valgrind.log','fuzz.log'):
                  lp = os.path.join(d, lg)
                  if not os.path.exists(lp): continue
                  txt = open(lp, errors='replace').read()
                  for pat, sev in (('ERROR: AddressSanitizer','high'),('runtime error:','high'),
                                   ('definitely lost','high'),('indirectly lost','medium'),
                                   ('ERROR: libFuzzer','high')):
                      for line in [l for l in txt.splitlines() if pat in l][:25]:
                          add(tool, sev, pat, line.strip())
              for lgname, pats in (
                  ('cbmc.log', [('VERIFICATION FAILED','high','cbmc-verification'),
                                (': FAILURE','high','cbmc-failure')]),
                  ('afl-crashes.txt', [('crash','high','afl-crash')]),
                  ('heaptrack.log', [('peak memory','info','heaptrack-peak'),
                                     ('leaked','medium','heaptrack-leak'),
                                     ('allocations','info','heaptrack-allocs')]),
              ):
                  lp = os.path.join(d, lgname)
                  if os.path.exists(lp):
                      for line in open(lp, errors='replace'):
                          for pat, sev, rule in pats:
                              if pat in line:
                                  add(tool, sev, rule, line.strip())
              for lgname in ('actionlint.log','smatch.log','coccinelle.log'):
                  lp = os.path.join(d, lgname)
                  if not os.path.exists(lp): continue
                  for line in open(lp, errors='replace'):
                      m = genpat.match(line.strip())
                      if m and m.group(4) and not m.group(1).startswith('='):
                          try: ln = int(m.group(2))
                          except ValueError: ln = 0
                          add(tool, 'medium', lgname.split('.')[0], m.group(4)[:300], m.group(1), ln)
              tj = os.path.join(d, 'trufflehog.json')
              if os.path.exists(tj):
                  for line in open(tj, errors='replace'):
                      try: o = json.loads(line)
                      except Exception: continue
                      det = o.get('DetectorName') or 'secret'
                      fpath = ((o.get('SourceMetadata') or {}).get('Data') or {}).get('Filesystem',{}).get('file','')
                      add(tool, 'high', 'trufflehog', f'verified {det} credential', fpath)
              dj = os.path.join(d, 'detect-secrets.json')
              if os.path.exists(dj):
                  try: o = json.load(open(dj, errors='replace'))
                  except Exception: o = {}
                  for fname, hits in (o.get('results') or {}).items():
                      for h in hits:
                          add(tool, 'medium', h.get('type','secret'),
                              f"possible {h.get('type','secret')}", fname,
                              h.get('line_number',0))
              logs = sorted(glob.glob(d + '/*.log'))
              excerpt = ''
              if logs:
                  t = open(logs[0], errors='replace').read().splitlines()
                  excerpt = '\n'.join(t[-200:])
              sections.append((tool, st, rc, len(findings) - n0, excerpt))
          for t in EXPECTED:
              statuses.setdefault(t, ('not run (job skipped or failed before upload)', ''))
          rank = sorted(findings, key=lambda f: (ORD[f['severity']], WEIGHT.get(f['tool'],4), f['tool']))
          hot = []
          try:
              csv = subprocess.run(['lizard','--csv','.'], capture_output=True, text=True,
                                   timeout=600).stdout
              rows = [r.split(',') for r in csv.strip().splitlines()[1:] if r.count(',') >= 6]
              churn = collections.Counter()
              g = subprocess.run(['git','log','--since=12 months ago','--numstat','--format='],
                                 capture_output=True, text=True).stdout
              for line in g.splitlines():
                  parts = line.split('\t')
                  if len(parts) == 3 and parts[2]:
                      try: churn[parts[2]] += int(parts[0] or 0) + int(parts[1] or 0)
                      except ValueError: pass
              for r in rows:
                  loc = r[5]; f = loc.split(':')[0]
                  hot.append((int(r[1]), churn.get(f,0), loc))
              hot = sorted(hot, key=lambda x: -(x[0] * (1 + x[1]/200.0)))[:20]
          except Exception:
              hot = []
          sha = subprocess.run(['git','rev-parse','--short','HEAD'],
                               capture_output=True, text=True).stdout.strip()
          now = subprocess.run(['date','-u'], capture_output=True, text=True).stdout.strip()
          bs = statuses.get('build', ('unknown',''))[0]
          with open(OUT, 'w') as fh:
              fh.write(f"# KyroSpades deep audit\n\n")
              fh.write(f"Commit `{sha}` - {now}\n\n")
              fh.write(f"Build gate: **{bs}** - total findings: **{len(findings)}**\n\n")
              fh.write("## Digest, ranked for humans and for fix agents\n\n")
              if not rank:
                  fh.write("No findings parsed from any tool. Check the skipped list below.\n\n")
              for i, f in enumerate(rank[:25], 1):
                  loc = f"{f['file']}:{f['line']}" if f['file'] else 'n/a'
                  fh.write(f"{i}. **[{f['severity']}]** `{loc}` {f['rule']} ({f['tool']}): {f['message']}\n")
              fh.write("\n## Hotspots: cyclomatic complexity crossed with 12-month churn\n\n")
              fh.write("| CCN | churn lines | function |\n|---|---|---|\n")
              for ccn, ch, loc in hot:
                  fh.write(f"| {ccn} | {ch} | `{loc}` |\n")
              fh.write("\n## Machine-readable findings (the contract for fix agents)\n\n```json\n")
              json.dump(rank[:1000], fh, indent=1)
              fh.write("\n```\n\n## Tool by tool\n\n")
              for tool, st, rc, n, excerpt in sections:
                  fh.write(f"### {tool} - status: {st}" + (f", exit {rc}" if rc else "") + f", findings parsed: {n}\n\n")
                  tf = [f for f in rank if f['tool'] == tool or (tool == 'build' and f['tool'] == 'gcc-warnings')][:10]
                  for f in tf:
                      loc = f"{f['file']}:{f['line']}" if f['file'] else 'n/a'
                      fh.write(f"- [{f['severity']}] `{loc}` {f['rule']}: {f['message']}\n")
                  if excerpt:
                      fh.write(f"\n<details><summary>raw log tail</summary>\n\n```\n{excerpt}\n```\n\n</details>\n\n")
              fh.write("## Skipped or failed tools and how to enable them\n\n")
              for tool, (st, rc) in sorted(statuses.items()):
                  if st not in ('ok',):
                      fh.write(f"- **{tool}**: {st}\n")
              fh.write("\nEnablers: audit/build.sh, audit/run-headless.sh, audit/fuzz-targets.txt, "
                       "audit/eva-targets.txt, audit/esbmc/*.c, audit/cbmc/*.c, audit/cocci/*.cocci, "
                       ".semgrep/custom.yml\n")
          print(f"report written: {len(findings)} findings, {len(sections)} tool sections")
          PY
      - uses: actions/upload-artifact@v4
        with: { name: audit-report, path: KyroSpades-Audit.md }
      - uses: actions/upload-artifact@v4
        with: { name: raw-tool-outputs, path: raw/ }
